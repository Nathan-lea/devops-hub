name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks 密钥扫描
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml

      - name: Shell 语法检查
        run: bash -n scripts/*.sh hooks/pre-commit hooks/pre-push

      - name: YAML 解析检查
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 -c "import yaml,glob,os;[list(yaml.safe_load_all(open(f))) for f in glob.glob('configs/**/*.y*ml',recursive=True)+glob.glob('playbooks/*.yml')]"