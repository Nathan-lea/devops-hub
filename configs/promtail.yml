# Promtail 配置 - 日志采集端
# 部署在每台被管主机上

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://10.0.0.12:3100/loki/api/v1/push    # Loki 地址
    tenant_id: prod
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    batchsize: 1048576          # 1MB
    batchwait: 1s

scrape_configs:
  # ============ 系统日志 ============
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          host: ${HOSTNAME}
    journal:
      max_age: 24h
      labels:
        job: journald
    pipeline_stages:
      - match:
          selector: '{job="journald"}'
          stages:
            - json:
                expressions:
                  level: PRIORITY
                  unit: _SYSTEMD_UNIT
            - labels:
                level:
            - output:
                source: MESSAGE

  # ============ 系统日志文件 ============
  - job_name: syslog-file
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          host: ${HOSTNAME}
          __path__: /var/log/messages /var/log/syslog /var/log/secure /var/log/auth.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w{3} +\d+ \d+:\d+:\d+) (?P<host>\S+) (?P<program>\S+?)(\[\d+\])?: (?P<message>.*)$'
      - labels:
          program:

  # ============ MySQL 慢查询日志 ============
  - job_name: mysql_slow
    static_configs:
      - targets: [localhost]
        labels:
          job: mysql_slow
          host: ${HOSTNAME}
          __path__: /var/log/mysql/slow.log
    pipeline_stages:
      - regex:
          expression: '# Query_time: (?P<query_time>[0-9.]+) Lock_time: (?P<lock_time>[0-9.]+) Rows_sent: (?P<rows_sent>\d+) Rows_examined: (?P<rows_examined>\d+)'

  # ============ MySQL 错误日志 ============
  - job_name: mysql_error
    static_configs:
      - targets: [localhost]
        labels:
          job: mysql_error
          host: ${HOSTNAME}
          __path__: /var/log/mysql/error.log

  # ============ Nginx access ============
  - job_name: nginx_access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx_access
          host: ${HOSTNAME}
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '(?P<remote_addr>\S+) - \S+ \[(?P<time>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<proto>[^"]+)" (?P<status>\d+) (?P<bytes>\d+) "[^"]*" "(?P<ua>[^"]*)"'
      - labels:
          status:
          method:

  # ============ Nginx error ============
  - job_name: nginx_error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx_error
          host: ${HOSTNAME}
          __path__: /var/log/nginx/error.log

  # ============ 应用日志 ============
  - job_name: app_logs
    static_configs:
      - targets: [localhost]
        labels:
          job: app
          host: ${HOSTNAME}
          __path__: /app/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            app: app
      - labels:
          level:
          app:

  # ============ 审计日志（安全合规） ============
  - job_name: audit_log
    static_configs:
      - targets: [localhost]
        labels:
          job: audit
          host: ${HOSTNAME}
          __path__: /var/log/audit/audit.log
    pipeline_stages:
      - json:
          expressions:
            type: type
            op: op
      - labels:
          type:

limits_config:
  readline_rate: 10000
  readline_burst: 20000
  max_line_size: 256000

tracing:
  enabled: false
