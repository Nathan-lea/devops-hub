# K8s 资源配额
# 防止某个命名空间占用过多资源

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-resources
  namespace: default
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: object-counts
  namespace: default
spec:
  hard:
    configmaps: "20"
    persistentvolumeclaims: "10"
    replicationcontrollers: "20"
    secrets: "20"
    services: "20"
    services.loadbalancers: "2"
