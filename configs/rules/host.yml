# 主机层告警规则
groups:
  - name: host_alerts
    rules:
      # 主机宕机
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "主机 {{ $labels.host }} 宕机"
          description: "主机 {{ $labels.host }} 已离线超过 1 分钟"

      # CPU 使用率过高
      - alert: HighCpuUsage
        expr: 100 - (avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: major
        annotations:
          summary: "{{ $labels.host }} CPU 使用率过高"
          description: "CPU 使用率 > 90% 已持续 5 分钟，当前值: {{ $value }}%"

      # 内存使用率过高
      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: major
        annotations:
          summary: "{{ $labels.host }} 内存使用率过高"
          description: "内存使用率 > 90%，当前值: {{ $value }}%"

      # 磁盘空间不足（警告）
      - alert: DiskSpaceWarning
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 5m
        labels:
          severity: minor
        annotations:
          summary: "{{ $labels.host }} 磁盘空间不足"
          description: "挂载点 {{ $labels.mountpoint }} 使用率 > 85%"

      # 磁盘空间严重不足
      - alert: DiskSpaceCritical
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} 磁盘空间严重不足"
          description: "挂载点 {{ $labels.mountpoint }} 使用率 > 95%，请立即处理"

      # 系统负载过高
      - alert: HighLoad
        expr: node_load5 > count by (host) (node_cpu_seconds_total{mode="idle"}) * 2
        for: 10m
        labels:
          severity: major
        annotations:
          summary: "{{ $labels.host }} 系统负载过高"
          description: "load5 = {{ $value }}，超过 CPU 核数的 2 倍"

      # 磁盘 inode 不足
      - alert: DiskInodeWarning
        expr: (1 - node_filesystem_files_free / node_filesystem_files) * 100 > 80
        for: 5m
        labels:
          severity: minor
        annotations:
          summary: "{{ $labels.host }} 磁盘 inode 不足"
          description: "inode 使用率 > 80%"

      # 文件句柄耗尽
      - alert: FileDescriptorWarning
        expr: (1 - node_filefd_allocated / node_filefd_maximum) * 100 > 80
        for: 5m
        labels:
          severity: minor
        annotations:
          summary: "{{ $labels.host }} 文件句柄使用率高"
          description: "文件句柄使用率 > 80%"

      # 时钟偏移
      - alert: ClockSkewDetected
        expr: abs(node_timex_offset_seconds) > 1
        for: 2m
        labels:
          severity: major
        annotations:
          summary: "{{ $labels.host }} 时钟偏移"
          description: "时间偏差超过 1 秒，可能影响分布式系统"

      # 主机重启
      - alert: HostRebooted
        expr: increase(node_boot_time_seconds[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} 已重启"
          description: "检测到主机重启事件"

      # 网络丢包
      - alert: NetworkPacketLoss
        expr: rate(node_network_receive_errs_total[5m]) > 10
        for: 5m
        labels:
          severity: minor
        annotations:
          summary: "{{ $labels.host }} 网络错误"
          description: "网络接收错误率高"
