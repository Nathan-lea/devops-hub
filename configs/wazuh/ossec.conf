<!-- Wazuh Manager 服务端配置 -->
<!-- 部署在 Wazuh Server（管控安全中心） -->

<ossec_config>

  <!-- ========== 全局配置 ========== -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>yes</email_notification>
    <smtp_server>smtp.example.com</smtp_server>
    <email_from>wazuh@example.com</email_from>
    <email_to>security@example.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
  </global>

  <!-- ========== 告警级别 ========== -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- ========== Agent 注册 ========== -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <force_insert>yes</force_insert>
    <force_time>0</force_time>
    <purge>yes</purge>
    <use_password>yes</use_password>
    <limit_maxagents>yes</limit_maxagents>
    <crawler>60</crawler>
  </auth>

  <!-- ========== 集群配置 ========== -->
  <cluster>
    <name>wazuh</name>
    <node_name>node01</node_name>
    <node_type>master</node_type>
    <key>CHANGE_ME_TO_RANDOM_KEY</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes/>
    <hidden>no</hidden>
    <disable_historical>no</disable_historical>
  </cluster>

  <!-- ========== 远程 Agent 通信 ========== -->
  <remote>
    <connection>tcp</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- ========== 文件完整性监控规则 ========== -->
  <syscheck>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
  </syscheck>

  <!-- ========== Rootkit 检测 ========== -->
  <rootcheck>
    <frequency>86400</frequency>
    <scan_on_start>yes</scan_on_start>
  </rootcheck>

  <!-- ========== 漏洞检测 ========== -->
  <wodle name="vulnerability-detection">
    <enabled>yes</enabled>
    <interval>1h</interval>
    <ignore_time>6h</ignore_time>
    <update_interval>3h</update_interval>
  </wodle>

  <!-- ========== 系统信息采集 ========== -->
  <wodle name="syscollector">
    <enabled>yes</enabled>
    <interval>1h</interval>
    <network>yes</network>
    <os>yes</os>
    <hardware>yes</hardware>
    <packages>yes</packages>
    <processes>yes</processes>
    <ports all="yes">yes</ports>
  </wodle>

  <!-- ========== 主动响应：自动封禁恶意IP ========== -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop.sh</executable>
    <expect>srcip</expect>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>host-deny</name>
    <executable>host-deny.sh</executable>
    <expect>srcip</expect>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>disable-account</name>
    <executable>disable-account.sh</executable>
    <expect>user</expect>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- SSH 爆破 -> 封禁 24 小时 -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5712,5715,5716,5717,5718,5740,5741,5742,5743,5744,5745,5746,5747,5748</rules_id>
    <timeout>86400</timeout>
  </active-response>

  <!-- Web 攻击 -> 封禁 7 天 -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>31151,31152,31153,31171,31172,31173</rules_id>
    <timeout>604800</timeout>
  </active-response>

  <!-- 异常用户 -> 禁用账号 -->
  <active-response>
    <command>disable-account</command>
    <location>local</location>
    <rules_id>5762,5763,5764</rules_id>
    <timeout>3600</timeout>
  </active-response>

  <!-- ========== 规则文件 ========== -->
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>

    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>

    <update_rules>yes</update_rules>
    <update_force_rules>yes</update_force_rules>
  </ruleset>

  <!-- ========== 日志采集 ========== -->
  <!-- Wazuh Manager 自身日志 -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/ossec/logs/alerts/alerts.json</location>
  </localfile>

  <!-- ========== 威胁情报集成 ========== -->
  <rule_test>
    <enabled>yes</enabled>
  </rule_test>

</ossec_config>
