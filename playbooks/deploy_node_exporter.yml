---
# Playbook: 部署 node_exporter 到所有 Linux 主机
# 适配 Debian/Ubuntu/CentOS
# 幂等执行，支持重复运行

- name: 部署 node_exporter
  hosts: all
  become: yes
  vars:
    node_exporter_version: "1.7.0"
    node_exporter_port: 9100
    node_exporter_user: "node_exporter"
    node_exporter_dir: "/opt/node_exporter"
    node_exporter_textfile_dir: "/var/lib/node_exporter/textfile"

  tasks:
    - name: 创建 node_exporter 用户
      user:
        name: "{{ node_exporter_user }}"
        shell: /sbin/nologin
        system: yes
        create_home: no

    - name: 创建目录
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_user }}"
        mode: "0755"
      loop:
        - "{{ node_exporter_dir }}"
        - "{{ node_exporter_textfile_dir }}"

    - name: 判断架构
      set_fact:
        arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"

    - name: 下载 node_exporter
      unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ arch }}.tar.gz"
        dest: /tmp/
        remote_src: yes
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ arch }}"

    - name: 复制二进制文件
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ arch }}/node_exporter"
        dest: "{{ node_exporter_dir }}/node_exporter"
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_user }}"
        mode: "0755"
        remote_src: yes

    - name: 创建 systemd 服务
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=node_exporter
          After=network.target

          [Service]
          User={{ node_exporter_user }}
          Group={{ node_exporter_user }}
          Type=simple
          ExecStart={{ node_exporter_dir }}/node_exporter \
            --web.listen-address=:{{ node_exporter_port }} \
            --collector.textfile.directory={{ node_exporter_textfile_dir }} \
            --collector.systemd \
            --collector.processes \
            --no-collector.infiniband \
            --no-collector.ipvs
          Restart=on-failure
          RestartSec=5
          LimitNOFILE=65536

          [Install]
          WantedBy=multi-user.target
      notify: restart node_exporter

    - name: 配置防火墙（仅允许监控节点）
      ansible.posix.firewalld:
        port: "{{ node_exporter_port }}/tcp"
        source: "10.0.0.10/32"
        state: enabled
        permanent: yes
        immediate: yes
      when: ansible_os_family == "RedHat"

    - name: 配置 ufw（Debian/Ubuntu）
      community.general.ufw:
        rule: allow
        port: "{{ node_exporter_port }}"
        proto: tcp
        src: "10.0.0.10/32"
      when: ansible_os_family == "Debian"

    - name: 启动并开机自启
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes

    - name: 验证运行
      uri:
        url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
        return_content: no
        status_code: 200

  handlers:
    - name: restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
        daemon_reload: yes
