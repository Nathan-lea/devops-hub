# ============================================================
# 多客户 Ansible Inventory 示例
# ============================================================
# 设计原则：三层分组
#   第一层：按客户分组（customer_<id>）-- 驱动 group_vars 差异化
#   第二层：按角色分组（<customer>_<role>）-- 驱动 Playbook 任务
#   第三层：按发行版/云厂商分组 -- 驱动系统级差异
#
# 运维时按客户 + 角色组合定位主机：
#   ansible customer_acme_mysql -m ping
#   ansible customer_acme -m setup   # 操作该客户全部主机
# ============================================================

# ============ 客户 A: acme-corp (premium SLA) ============
[customer_acme_web]
acme-web-01 ansible_host=10.10.1.11
acme-web-02 ansible_host=10.10.1.12

[customer_acme_mysql]
acme-mysql-master ansible_host=10.10.2.10
acme-mysql-slave-01 ansible_host=10.10.2.11

[customer_acme_redis]
acme-redis-01 ansible_host=10.10.5.10

[customer_acme:children]
customer_acme_web
customer_acme_mysql
customer_acme_redis


# ============ 客户 B: globex-inc (standard SLA) ============
[customer_globex_web]
globex-web-01 ansible_host=10.20.1.11

[customer_globex_mysql]
globex-mysql-master ansible_host=10.20.2.10
globex-mysql-slave-01 ansible_host=10.20.2.11
globex-mysql-slave-02 ansible_host=10.20.2.12

[customer_globex_pg]
globex-pg-primary ansible_host=10.20.3.10
globex-pg-replica-01 ansible_host=10.20.3.11

[customer_globex_k8s_master]
globex-k8s-m1 ansible_host=10.20.6.10
globex-k8s-m2 ansible_host=10.20.6.11

[customer_globex_k8s_worker]
globex-k8s-w1 ansible_host=10.20.6.20
globex-k8s-w2 ansible_host=10.20.6.21

[customer_globex:children]
customer_globex_web
customer_globex_mysql
customer_globex_pg
customer_globex_k8s_master
customer_globex_k8s_worker


# ============ 客户 C: initech-ltd (basic SLA) ============
[customer_initech_web]
initech-web-01 ansible_host=10.30.1.11

[customer_initech_mysql]
initech-mysql-01 ansible_host=10.30.2.10

[customer_initech:children]
customer_initech_web
customer_initech_mysql


# ============ 按角色聚合（跨客户，用于全局巡检）============
[role_mysql:children]
customer_acme_mysql
customer_globex_mysql
customer_initech_mysql

[role_web:children]
customer_acme_web
customer_globex_web
customer_initech_web

[role_pg:children]
customer_globex_pg

[role_redis:children]
customer_acme_redis

[role_k8s:children]
customer_globex_k8s_master
customer_globex_k8s_worker


# ============ 按发行版分组（跨客户）============
[debian:children]
customer_acme_web
customer_initech_web

[ubuntu:children]
customer_globex_mysql
customer_globex_pg

[centos:children]
customer_acme_mysql
customer_globex_k8s_master


# ============ 按云厂商分组 ============
[aliyun:children]
customer_acme_web
customer_acme_mysql

[aws:children]
customer_globex_web
customer_globex_mysql

[onprem:children]
customer_initech_web
customer_initech_mysql


# ============ 运维管控平台（所有客户共享）============
[monitoring]
prometheus ansible_host=10.0.0.10
grafana ansible_host=10.0.0.11
alertmanager ansible_host=10.0.0.15
victoriametrics ansible_host=10.0.0.13

[ansible_control]
awx ansible_host=10.0.0.20

[bastion]
jumpserver ansible_host=10.0.0.30

[security_center]
wazuh-manager ansible_host=10.0.0.16
suricata-01 ansible_host=10.0.0.19


# ============ 全局变量 ============
[all:vars]
ansible_user=ops
ansible_ssh_port=22222
ansible_ssh_private_key_file=~/.ssh/ops_ed25519
ansible_become=yes
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
host_key_checking=False

# ============ 客户级变量（也可用 group_vars/ 目录管理）============
# 推荐使用 playbooks/group_vars/customer_<id>/vars.yml 管理
# 此处仅列示例：
[customer_acme:vars]
customer_id=acme
sla_level=premium
monitoring_scrape_interval=10s
backup_retention_daily=30
security_baseline=cis-l2

[customer_globex:vars]
customer_id=globex
sla_level=standard
monitoring_scrape_interval=15s
backup_retention_daily=14
security_baseline=cis-l1

[customer_initech:vars]
customer_id=initech
sla_level=basic
monitoring_scrape_interval=30s
backup_retention_daily=7
security_baseline=cis-l1
