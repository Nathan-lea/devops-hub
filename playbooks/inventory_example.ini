# Ansible Inventory 示例
# 生产环境建议使用动态 inventory（云厂商 API 自动同步）

# ============ 按发行版分组 ============
[debian]
deb-web-01 ansible_host=10.0.1.11 ansible_python_interpreter=/usr/bin/python3

[ubuntu]
ubuntu-db-01 ansible_host=10.0.2.21 ansible_python_interpreter=/usr/bin/python3

[centos]
centos-master-01 ansible_host=10.0.3.31 ansible_python_interpreter=/usr/bin/python3


# ============ 按角色分组 ============
[postgresql]
pg-primary ansible_host=10.0.3.10
pg-replica-01 ansible_host=10.0.3.11
pg-replica-02 ansible_host=10.0.3.12

# ============ 按角色分组 ============
[mysql]
mysql-master ansible_host=10.0.2.10
mysql-slave-01 ansible_host=10.0.2.11
mysql-slave-02 ansible_host=10.0.2.12

[tidb]
tidb-pd-01 ansible_host=10.0.4.10
tidb-pd-02 ansible_host=10.0.4.11
tidb-pd-03 ansible_host=10.0.4.12
tidb-tikv-01 ansible_host=10.0.4.20
tidb-tikv-02 ansible_host=10.0.4.21
tidb-tikv-03 ansible_host=10.0.4.22
tidb-server-01 ansible_host=10.0.4.30

[redis]
redis-master ansible_host=10.0.5.10
redis-slave-01 ansible_host=10.0.5.11
redis-slave-02 ansible_host=10.0.5.12
redis-sentinel-01 ansible_host=10.0.5.13
redis-sentinel-02 ansible_host=10.0.5.14
redis-sentinel-03 ansible_host=10.0.5.15

[web]
web-01 ansible_host=10.0.1.11
web-02 ansible_host=10.0.1.12
web-03 ansible_host=10.0.1.13

[k8s_master]
k8s-m1 ansible_host=10.0.6.10
k8s-m2 ansible_host=10.0.6.11
k8s-m3 ansible_host=10.0.6.12

[k8s_worker]
k8s-w1 ansible_host=10.0.6.20
k8s-w2 ansible_host=10.0.6.21
k8s-w3 ansible_host=10.0.6.22

# ============ 运维管控平台 ============
[monitoring]
prometheus ansible_host=10.0.0.10
prometheus-replica ansible_host=10.0.0.14
grafana ansible_host=10.0.0.11
loki ansible_host=10.0.0.12
alertmanager ansible_host=10.0.0.15
victoriametrics ansible_host=10.0.0.13

[ansible_control]
awx ansible_host=10.0.0.20

[bastion]
jumpserver ansible_host=10.0.0.30

[minio]
minio-01 ansible_host=10.0.0.40
minio-02 ansible_host=10.0.0.41
minio-03 ansible_host=10.0.0.42
minio-04 ansible_host=10.0.0.43

# ============ 按环境分组（children） ============
[prod:children]
postgresql
mysql
tidb
redis
web
k8s_master
k8s_worker

[infra:children]
monitoring
ansible_control
bastion
minio

# ============ 按云厂商分组 ============
[aliyun]
web-01
web-02

[aws]
web-03

[onprem]
mysql-master
tidb-pd-01

# ============ 全局变量 ============
[all:vars]
ansible_user=ops
ansible_ssh_port=22222
ansible_ssh_private_key_file=~/.ssh/ops_ed25519
ansible_become=yes
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
host_key_checking=False

# ============ 组变量示例 ============
# group_vars/mysql.yml 内容：
# mysql_root_password: "{{ vault_mysql_root }}"
# mysql_backup_password: "{{ vault_mysql_backup }}"
# mysql_version: "8.0"

# ============ 安全中心 ============
[security_center]
wazuh-manager ansible_host=10.0.0.16
wazuh-indexer ansible_host=10.0.0.17
wazuh-dashboard ansible_host=10.0.0.18
suricata-01 ansible_host=10.0.0.19
