# ============================================================
# Ansible group_vars - 客户 B: globex (standard SLA)
# ============================================================

customer_id: "globex"
customer_name: "Globex 工业集团"
sla_level: "standard"

# ---- 监控阈值覆盖 ----
monitoring_scrape_interval: "15s"
monitoring_cpu_critical: 85
monitoring_cpu_warning: 70
monitoring_disk_critical: 90
monitoring_mem_warning: 85
monitoring_mysql_connection_pct: 80
monitoring_mysql_repl_lag: 120

# ---- 告警路由 ----
alerting_webhook_url: "http://10.0.0.15:5001/webhook/globex"
alerting_email_to: "ops@globex.com"
alerting_phone_enabled: false

# ---- 安全基线 ----
security_baseline_level: "cis-l1"
security_firewall_policy: "standard"
security_waf_enabled: true
security_hids_enabled: true
security_log_retention_days: 180
security_compliance:
  - "等保二级"

# ---- 备份策略 ----
backup_retention_daily: 14
backup_retention_weekly: 8
backup_retention_monthly: 12
backup_frequency_full: "daily"
backup_frequency_incremental: "every-6h"
backup_offsite_enabled: false
backup_offsite_region: ""
backup_encryption: true

# ---- 变更窗口 ----
change_window_regular: "周三 22:00-24:00"
change_window_major: "周六 00:00-04:00"
change_window_blackout:
  - "周一至周五 09:00-18:00"
change_emergency: "approval_required"

# ---- 访问控制 ----
ssh_access_mode: "bastion_only"
bastion_host: "jumpserver"
root_login: false
audit_enabled: true
audit_retention_days: 180

# ---- 报告 ----
report_monthly: true
report_recipients:
  - "manager@globex.com"
  - "ops@globex.com"
